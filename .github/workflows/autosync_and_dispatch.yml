name: Auto-sync upstream and run build_release

on:
  schedule:
    - cron: "17 3 * * *"  # daily at 03:17 UTC
  workflow_dispatch: {}    # manual "Run workflow" button

permissions:
  contents: write   # push updates
  actions: write    # dispatch another workflow

concurrency:
  group: autosync-${{ github.ref_name }}
  cancel-in-progress: false
  
env:
  UPSTREAM_OWNER: DokiTeam
  UPSTREAM_REPO: build-apps
  UPSTREAM_REF: global
  TARGET_BRANCH: global


jobs:
  sync-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git || true
          git fetch upstream ${UPSTREAM_REF}

      - name: Detect if upstream is ahead
        id: diff
        run: |
          AHEAD=$(git rev-list --count origin/${TARGET_BRANCH}..upstream/${UPSTREAM_REF} || echo 0)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          if [ "$AHEAD" -gt 0 ]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi

      # Only push when there are new commits; manual runs still build even if unchanged.
      - name: Fast-forward fork
        if: steps.diff.outputs.changed == 'true'
        run: |
          git checkout ${TARGET_BRANCH}
          git merge --ff-only upstream/${UPSTREAM_REF}
          git push origin HEAD:${TARGET_BRANCH}

      # ✅ On manual run -> always dispatch
      # ✅ On schedule    -> dispatch only if upstream changed
      - name: Run build_release.yml on selected branch
        if: github.event_name == 'workflow_dispatch' || steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build_release.yml --ref ${TARGET_BRANCH}
          echo "Dispatched build_release.yml on ${TARGET_BRANCH} (event=${{ github.event_name }})"
