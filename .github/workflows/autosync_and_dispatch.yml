name: Orchestrate upstream build_release (priority upstream)

on:
  schedule:
    - cron: "17 3 * * *"          # daily at 03:17 UTC
  workflow_dispatch: {}            # manual run => always build

permissions:
  contents: write                  # allow creating releases in your fork
  actions: read

concurrency:
  group: upstream-orchestrator-${{ github.ref_name }}
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: DokiTeam
  UPSTREAM_REPO: build-apps
  UPSTREAM_REF: global               # branch in the original repo to follow

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.get.outputs.sha }}
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Resolve upstream HEAD
        id: get
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/${UPSTREAM_REF} --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Decide to build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="upstream-${{ steps.get.outputs.sha }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already released $TAG — skipping."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "🛠️ New upstream ${TAG} — will build."
          fi

  # 👉 Call the upstream workflow (reusable) so it has priority over your fork’s copy.
  call-upstream:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    uses: DokiTeam/build-apps/.github/workflows/build_release.yml@base
    # If the upstream workflow defines inputs, pass them here:
    # with:
    #   upstream_sha: ${{ needs.detect.outputs.sha }}
    # Inherit your fork’s secrets to the called workflow:
    secrets: inherit
