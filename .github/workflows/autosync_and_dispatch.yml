name: Auto-sync upstream (prefer upstream) and run build_release

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch: {}    # manual "Run workflow" => always build

permissions:
  contents: write          # allow pushing merge and updating files
  actions: write           # allow dispatching another workflow

concurrency:
  group: autosync-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # --- configure these for your setup ---
  UPSTREAM_OWNER: DokiTeam
  UPSTREAM_REPO: build-apps
  UPSTREAM_REF: global         # upstream branch to follow
  TARGET_BRANCH: global      # your fork branch that holds workflows
  BUILD_WORKFLOW_FILE: build_release.yml
  # Files that must ALWAYS keep your fork's version:
  EXCEPTIONS: |
    README.md
    .github/workflows/autosync_and_dispatch.yml

jobs:
  sync-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false   # don't persist GITHUB_TOKEN
      - name: Merge upstream (prefer upstream / keep exceptions)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git || true
          git fetch upstream "${UPSTREAM_REF}"

          PRE_SHA=$(git rev-parse HEAD)
          git merge -X theirs --no-edit "upstream/${UPSTREAM_REF}" || true

          # Keep your local copies of README + this orchestrator
          git restore --source="$PRE_SHA" -- README.md .github/workflows/autosync_and_dispatch.yml || true
          git add -A

          # Commit only if something actually changed
          if ! git diff --cached --quiet; then
            git commit -m "sync: prefer upstream, keep README/orchestrator"
          fi
      - name: Push using PAT with Workflows permission
        if: always()
        env:
          TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          # Use PAT so updating .github/workflows/** is allowed
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${TARGET_BRANCH}
      - name: Dispatch build_release on updated branch
        # On manual run -> always; on schedule -> only if you want, remove condition to always run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}   # gh CLI reads GH_TOKEN
        run: gh workflow run "${BUILD_WORKFLOW_FILE}" --ref "${TARGET_BRANCH}"
